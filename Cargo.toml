[package]
name = "astrology_website"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
cfg-if = "1.0.4"
chrono = { version = "0.4.45", features = ["serde"] }
console_error_panic_hook = "0.1.7"
leptos = "0.8.19"
leptos_meta = "0.8.6"
leptos_router = "0.8.13"
nutype = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
uuid = { version = "1.23.4", features = ["v4", "v7", "js"] }
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = ["Window", "Storage"] }

axum = { version = "0.8.9", optional = true }
config = { version = "0.15.25", optional = true }
email_address = { version = "0.2.9", optional = true }
leptos_axum = { version = "0.8.9", optional = true }
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-native-certs"], optional = true }
phonenumber = { version = "0.3.9", optional = true }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono", "uuid"], optional = true }
teloxide = { version = "0.17.0", optional = true }
tokio = { version = "1.52.3", features = ["full"], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }

[features]
hydrate = [
    "leptos/hydrate",
]
ssr = [
    "axum",
    "config",
    "email_address",
    "leptos/ssr",
    "leptos_axum",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "lettre",
    "phonenumber",
    "sqlx",
    "teloxide",
    "tokio",
    "tracing",
    "tracing-subscriber",
]

[package.metadata.leptos]
bin-features = ["ssr"]
lib-features = ["hydrate"]
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
browserquery = "defaults"
tailwind-input-file = "style/main.css"
